<svg viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1500" height="980" fill="#f8fafc"/>

  <!-- Title -->
  <text x="750" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Multi-Agent Conversational Data Analysis System</text>
  <text x="750" y="62" text-anchor="middle" font-size="16" fill="#64748b">Architecture Overview</text>

  <!-- User -->
  <circle cx="750" cy="114" r="24" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <circle cx="750" cy="105" r="7.5" fill="#334155"/>
  <path d="M737,122 a13,11 0 0,1 26,0" fill="#334155"/>
  <text x="750" y="156" text-anchor="middle" font-size="15" fill="#334155" font-weight="600">User</text>

  <path d="M750,139 L750,170" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- REPL -->
  <rect x="650" y="172" width="200" height="58" rx="10" fill="#334155"/>
  <text x="750" y="198" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">REPL</text>
  <text x="750" y="218" text-anchor="middle" font-size="13" fill="#cbd5e1">Interactive CLI</text>

  <path d="M750,230 L750,259" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="470" y="261" width="560" height="136" rx="14" fill="#4338ca"/>
  <text x="750" y="294" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">LangGraph Orchestrator</text>
  <text x="750" y="313" text-anchor="middle" font-size="13" fill="#c7d2fe">conversation state · MCP tool invocation · final response</text>

  <rect x="490" y="322" width="160" height="52" rx="8" fill="#6366f1"/>
  <text x="570" y="344" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Router</text>
  <text x="570" y="362" text-anchor="middle" font-size="12.5" fill="#e0e7ff">selects agent</text>

  <rect x="670" y="322" width="160" height="52" rx="8" fill="#6366f1"/>
  <text x="750" y="344" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Narrator</text>
  <text x="750" y="362" text-anchor="middle" font-size="12.5" fill="#e0e7ff">structured → NL</text>

  <rect x="850" y="322" width="160" height="52" rx="8" fill="#6366f1"/>
  <text x="930" y="344" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">History</text>
  <text x="930" y="362" text-anchor="middle" font-size="12.5" fill="#e0e7ff">session memory</text>

  <!-- Grouping box for agents -->
  <rect x="50" y="416" width="1420" height="188" rx="16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="750" y="407" text-anchor="middle" font-size="14.5" fill="#64748b" font-weight="600">Specialized MCP Agents — the router calls exactly one of these per question</text>

  <!-- Fan-out arrows from orchestrator to agents (bidirectional) -->
  <path d="M750,397 L235,438" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M750,397 L585,438" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M750,397 L935,438" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M750,397 L1285,438" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Data Query Agent -->
  <rect x="70" y="438" width="330" height="150" rx="12" fill="#059669"/>
  <text x="235" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Data Query Agent</text>
  <text x="235" y="496" text-anchor="middle" font-size="14" fill="#d1fae5">NL → read-only SQL</text>
  <text x="235" y="518" text-anchor="middle" font-size="14" fill="#d1fae5">validated by safety.py</text>
  <text x="235" y="540" text-anchor="middle" font-size="14" fill="#d1fae5">reads via core/db.py</text>
  <text x="235" y="562" text-anchor="middle" font-size="14" fill="#d1fae5">self-corrects, up to 3 tries</text>

  <!-- Analysis Agent -->
  <rect x="420" y="438" width="330" height="150" rx="12" fill="#d97706"/>
  <text x="585" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Analysis Agent</text>
  <text x="585" y="496" text-anchor="middle" font-size="14" fill="#ffedd5">cols + filters → DataFrame</text>
  <text x="585" y="518" text-anchor="middle" font-size="14" fill="#ffedd5">1 of 15 fixed functions</text>
  <text x="585" y="540" text-anchor="middle" font-size="14" fill="#ffedd5">reads via core/db.py</text>
  <text x="585" y="562" text-anchor="middle" font-size="14" fill="#ffedd5">self-corrects, up to 3 tries</text>

  <!-- Visualization Agent -->
  <rect x="770" y="438" width="330" height="150" rx="12" fill="#7c3aed"/>
  <text x="935" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Visualization Agent</text>
  <text x="935" y="496" text-anchor="middle" font-size="14" fill="#ede9fe">NL request → SQL → chart</text>
  <text x="935" y="518" text-anchor="middle" font-size="14" fill="#ede9fe">1 of 6 chart types, Matplotlib</text>
  <text x="935" y="540" text-anchor="middle" font-size="14" fill="#ede9fe">reads db.py, saves to results/</text>
  <text x="935" y="562" text-anchor="middle" font-size="14" fill="#ede9fe">self-corrects, up to 3 tries</text>

  <!-- Report Agent -->
  <rect x="1120" y="438" width="330" height="150" rx="12" fill="#e11d48"/>
  <text x="1285" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Report Agent</text>
  <text x="1285" y="496" text-anchor="middle" font-size="14" fill="#ffe4e6">reads full session history</text>
  <text x="1285" y="518" text-anchor="middle" font-size="14" fill="#ffe4e6">one LLM call, no DB access</text>
  <text x="1285" y="540" text-anchor="middle" font-size="14" fill="#ffe4e6">Markdown → results/</text>
  <text x="1285" y="562" text-anchor="middle" font-size="14" fill="#ffe4e6">no retry loop (unlike the others)</text>

  <!-- SQLite cylinder -->
  <g>
    <path d="M330,648 a80,16 0 1,0 160,0 a80,16 0 1,0 -160,0" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <path d="M330,648 L330,706 a80,16 0 0,0 160,0 L490,648" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <path d="M330,648 a80,16 0 0,0 160,0" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="410" y="682" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">SQLite</text>
    <text x="410" y="740" text-anchor="middle" font-size="15" fill="#475569" font-weight="600">Superstore Database</text>
    <text x="410" y="760" text-anchor="middle" font-size="13" fill="#64748b">read-only, via src/core/db.py</text>
  </g>

  <!-- Results folder -->
  <g>
    <path d="M1038,634 h46 l12,14 h88 v63 h-146 z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <text x="1111" y="682" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">results/</text>
    <text x="1111" y="740" text-anchor="middle" font-size="15" fill="#475569" font-weight="600">charts &amp; reports</text>
  </g>

  <!-- Data Query Agent -> SQLite -->
  <path d="M250,588 L375,648" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Analysis Agent -> SQLite -->
  <path d="M560,588 L450,648" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Visualization Agent -> SQLite -->
  <path d="M870,588 L478,655" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Visualization Agent -> results -->
  <path d="M960,588 L1075,634" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Report Agent -> results -->
  <path d="M1255,588 L1140,634" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="50" y="790" width="650" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="72" y="818" font-size="15.5" font-weight="700" fill="#0f172a">Legend</text>

  <path d="M72,840 L118,840" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="130" y="845" font-size="14" fill="#334155">Invocation / result (orchestrator ⇄ agent)</text>

  <path d="M72,866 L118,866" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="130" y="871" font-size="14" fill="#334155">Read-only query, through the one db.py chokepoint</text>

  <rect x="72" y="886" width="18" height="18" rx="3" fill="#4338ca"/>
  <text x="98" y="900" font-size="14" fill="#334155">Orchestration layer</text>

  <rect x="320" y="886" width="18" height="18" rx="3" fill="#059669"/>
  <text x="346" y="900" font-size="14" fill="#334155">MCP agents (color-coded)</text>

  <!-- Flow steps note -->
  <rect x="730" y="790" width="720" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="752" y="818" font-size="15.5" font-weight="700" fill="#0f172a">Typical Flow</text>
  <text x="752" y="842" font-size="14" fill="#334155">1. User asks a question in the REPL → sent to the orchestrator</text>
  <text x="752" y="864" font-size="14" fill="#334155">2. Router (LLM + keyword fallback) picks one of the four agents</text>
  <text x="752" y="886" font-size="14" fill="#334155">3. Narrator turns the structured result into natural language</text>
  <text x="752" y="908" font-size="14" fill="#334155">4. At session end, the Report Agent writes a summary to results/</text>

  <text x="750" y="955" text-anchor="middle" font-size="13" fill="#94a3b8">TFG: Multi-Agent Conversational Data Analysis System · UPF</text>
</svg>
